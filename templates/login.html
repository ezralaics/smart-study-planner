<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Study Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; }
        .login-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .login-banner { background: linear-gradient(135deg, #0d6efd 0%, #0a4da2 100%); color: white; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        .form-control:focus { border-color: #0d6efd; box-shadow: none; }
        .btn-primary { padding: 12px; font-weight: bold; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card login-card">
                <div class="row g-0">
                    <div class="col-md-5 login-banner d-none d-md-flex text-center">
                        <h2 class="fw-bold mb-3"><i class="bi bi-laptop"></i> Welcome Back</h2>
                        <p class="opacity-75">Ready to crush your study goals? Log in to access your personalized schedule.</p>
                        <div class="mt-4">
                            <i class="bi bi-shield-check" style="font-size: 3rem;"></i>
                        </div>
                    </div>

                    <div class="col-md-7 p-4 p-lg-5 bg-white">
                        <div class="text-center mb-4">
                            <h4 class="fw-bold">Login to Account</h4>
                            <p class="text-muted small">Please enter your credentials below</p>
                        </div>

                        {% if error %}
                        <div class="alert alert-danger py-2 small" role="alert">
                            <i class="bi bi-exclamation-circle me-2"></i> {{ error }}
                        </div>
                        {% endif %}
                        
                        <form action="/login" method="POST">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">USERNAME</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" class="form-control bg-light border-start-0" placeholder="Enter username" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" class="form-control bg-light border-start-0" placeholder="••••••••" required>
                                </div>
                            </div>

                           

                            <button type="submit" class="btn btn-primary w-100 mb-3">Login to Dashboard</button>
                            
                            <div class="text-center">
                                <p class="small text-muted mb-0">Don't have an account?</p>
                                <a href="/register" class="text-decoration-none small fw-bold">Sign up for free</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Smart Study Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; }
        .register-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .register-banner { background: linear-gradient(135deg, #0d6efd 0%, #0a4da2 100%); color: white; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        .form-control:focus { border-color: #0d6efd; box-shadow: none; }
        .btn-primary { padding: 12px; font-weight: bold; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card register-card">
                <div class="row g-0">
                    <div class="col-md-5 register-banner d-none d-md-flex">
                        <h2 class="fw-bold"><i class="bi bi-cpu"></i> Smart Study</h2>
                        <p class="mt-3 opacity-75">Join thousands of students organizing their academic life with AI-driven scheduling.</p>
                        <div class="mt-auto">
                            <small>Already have an account?</small><br>
                            <a href="/login" class="btn btn-outline-light btn-sm mt-2">Login Here</a>
                        </div>
                    </div>

                    <div class="col-md-7 p-4 p-lg-5 bg-white">
                        <h4 class="fw-bold mb-4">Create Your Account</h4>
                        
                        <form action="/register" method="POST">
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label class="form-label small fw-bold text-muted">FULL NAME</label>
                                    <input type="text" name="fullname" class="form-control" placeholder="John Doe" required>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label small fw-bold text-muted">EMAIL ADDRESS</label>
                                    <input type="email" name="email" class="form-control" placeholder="john@university.edu" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">ACCOUNT ROLE</label>
                                    <select name="role" id="user_role" class="form-select" required>
                                        <option value="student" selected>Student</option>
                                        <option value="educator">Educator / Lecturer</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">STUDENT / FACULTY TYPE</label>
                                    <select name="student_type" id="student_type" class="form-select" required>
                                        <option value="IT" selected>IT Programme / Faculty</option>
                                        <option value="Other">Other Discipline</option>
                                    </select>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label small fw-bold text-muted">COURSE / PROGRAMME</label>
                                    <input type="text" name="course" id="course_name" class="form-control" placeholder="e.g. Bachelor of Computer Science" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">USERNAME</label>
                                    <input type="text" name="username" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">PASSWORD</label>
                                    <input type="password" name="password" class="form-control" required>
                                </div>
                            </div>
                            <br>
                            <button type="submit" class="btn btn-primary w-100 mb-3">Complete Registration</button>
                            
                            <div class="text-center d-md-none">
                                <a href="/login" class="text-decoration-none small">Already have an account? Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    // Simple UI feedback based on segmentation
    const typeSelect = document.getElementById('student_type');
    const courseInput = document.getElementById('course_name');

    typeSelect.addEventListener('change', function() {
        if (this.value === 'IT') {
            courseInput.placeholder = "Enter your IT Major (e.g. Cyber Security)";
        } else {
            courseInput.placeholder = "Enter your specific programme name";
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Smart Study Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; }
        .register-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .register-banner { background: linear-gradient(135deg, #0d6efd 0%, #0a4da2 100%); color: white; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        .form-control:focus { border-color: #0d6efd; box-shadow: none; }
        .btn-primary { padding: 12px; font-weight: bold; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card register-card">
                <div class="row g-0">
                    <div class="col-md-5 register-banner d-none d-md-flex">
                        <h2 class="fw-bold"><i class="bi bi-cpu"></i> Smart Study</h2>
                        <p class="mt-3 opacity-75">Join thousands of students organizing their academic life with AI-driven scheduling.</p>
                        <div class="mt-auto">
                            <small>Already have an account?</small><br>
                            <a href="/login" class="btn btn-outline-light btn-sm mt-2">Login Here</a>
                        </div>
                    </div>

                    <div class="col-md-7 p-4 p-lg-5 bg-white">
                        <h4 class="fw-bold mb-3">Create Your Account</h4>

                        <!-- Sign up with Google -->
                        <a href="/auth/google" class="btn btn-outline-dark w-100 mb-3 d-flex align-items-center justify-content-center gap-2 shadow-sm py-2 rounded-3" style="border-color: #dadce0; font-weight: 600; background: #fff;">
                            <svg width="18" height="18" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                            </svg>
                            <span id="google-btn-text">Sign up with Google</span>
                        </a>

                        <div class="d-flex align-items-center mb-3">
                            <hr class="flex-grow-1 my-0 text-muted">
                            <span class="px-2 small text-muted text-uppercase" style="font-size: 0.72rem;">or register manually</span>
                            <hr class="flex-grow-1 my-0 text-muted">
                        </div>
                        
                        <form action="/register" method="POST">
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label class="form-label small fw-bold text-muted">FULL NAME</label>
                                    <input type="text" name="fullname" class="form-control" placeholder="John Doe" required>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label small fw-bold text-muted">EMAIL ADDRESS</label>
                                    <input type="email" name="email" class="form-control" placeholder="john@university.edu" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">ACCOUNT ROLE</label>
                                    <select name="role" id="user_role" class="form-select" onchange="toggleEducationLevelVisibility()" required>
                                        <option value="student" selected>Student</option>
                                        <option value="educator">Educator / Lecturer</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">STUDENT / FACULTY TYPE</label>
                                    <select name="student_type" id="student_type" class="form-select" required>
                                        <option value="IT" selected>IT Programme / Faculty</option>
                                        <option value="Other">Other Discipline</option>
                                    </select>
                                </div>

                                <div class="col-md-12" id="education_level_container">
                                    <label class="form-label small fw-bold text-muted d-block">LEARNING TIER / EDUCATION LEVEL</label>
                                    <div class="row g-2">
                                        <div class="col-6 col-sm-3">
                                            <input type="radio" class="btn-check" name="education_level" id="edu_primary" value="primary" autocomplete="off">
                                            <label class="btn btn-outline-primary w-100 p-2 text-center h-100 d-flex flex-column align-items-center justify-content-center border rounded-3 edu-tier-card" for="edu_primary">
                                                <i class="bi bi-backpack-fill fs-3 text-warning mb-1"></i>
                                                <span class="fw-bold small d-block">Primary</span>
                                                <span class="text-muted" style="font-size: 0.68rem;">Ages 7–12</span>
                                            </label>
                                        </div>
                                        <div class="col-6 col-sm-3">
                                            <input type="radio" class="btn-check" name="education_level" id="edu_secondary" value="secondary" autocomplete="off">
                                            <label class="btn btn-outline-primary w-100 p-2 text-center h-100 d-flex flex-column align-items-center justify-content-center border rounded-3 edu-tier-card" for="edu_secondary">
                                                <i class="bi bi-building fs-3 text-info mb-1"></i>
                                                <span class="fw-bold small d-block">Secondary</span>
                                                <span class="text-muted" style="font-size: 0.68rem;">High School</span>
                                            </label>
                                        </div>
                                        <div class="col-6 col-sm-3">
                                            <input type="radio" class="btn-check" name="education_level" id="edu_university" value="university" autocomplete="off" checked>
                                            <label class="btn btn-outline-primary w-100 p-2 text-center h-100 d-flex flex-column align-items-center justify-content-center border rounded-3 edu-tier-card" for="edu_university">
                                                <i class="bi bi-mortarboard-fill fs-3 text-primary mb-1"></i>
                                                <span class="fw-bold small d-block">University</span>
                                                <span class="text-muted" style="font-size: 0.68rem;">Higher Ed</span>
                                            </label>
                                        </div>
                                        <div class="col-6 col-sm-3">
                                            <input type="radio" class="btn-check" name="education_level" id="edu_general" value="general" autocomplete="off">
                                            <label class="btn btn-outline-primary w-100 p-2 text-center h-100 d-flex flex-column align-items-center justify-content-center border rounded-3 edu-tier-card" for="edu_general">
                                                <i class="bi bi-briefcase-fill fs-3 text-success mb-1"></i>
                                                <span class="fw-bold small d-block">General</span>
                                                <span class="text-muted" style="font-size: 0.68rem;">Lifelong/Cert</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label small fw-bold text-muted" id="programme_label">COURSE / PROGRAMME</label>
                                    <input type="text" name="course" id="course_name" class="form-control" placeholder="e.g. Bachelor of Computer Science" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">USERNAME</label>
                                    <input type="text" name="username" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">PASSWORD</label>
                                    <input type="password" name="password" class="form-control" required>
                                </div>
                            </div>
                            <br>
                            <button type="submit" class="btn btn-primary w-100 mb-3">Complete Registration</button>
                            
                            <div class="text-center d-md-none">
                                <a href="/login" class="text-decoration-none small">Already have an account? Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const typeSelect = document.getElementById('student_type');
    const courseInput = document.getElementById('course_name');
    const roleSelect = document.getElementById('user_role');
    const eduContainer = document.getElementById('education_level_container');
    const programmeLabel = document.getElementById('programme_label');

    function toggleEducationLevelVisibility() {
        if (roleSelect && eduContainer) {
            if (roleSelect.value === 'educator') {
                eduContainer.style.display = 'none';
                if (programmeLabel) programmeLabel.textContent = 'DEPARTMENT / FACULTY';
                if (courseInput) courseInput.placeholder = 'e.g. Faculty of Computing & Informatics';
            } else {
                eduContainer.style.display = 'block';
                updateTierLabels();
            }
        }
    }

    function updateTierLabels() {
        const checkedRadio = document.querySelector('input[name="education_level"]:checked');
        const val = checkedRadio ? checkedRadio.value : 'university';
        if (val === 'primary') {
            if (programmeLabel) programmeLabel.textContent = 'SCHOOL / CLASS GRADE';
            if (courseInput) courseInput.placeholder = 'e.g. Standard 5 / Grade 5';
        } else if (val === 'secondary') {
            if (programmeLabel) programmeLabel.textContent = 'HIGH SCHOOL PROGRAMME';
            if (courseInput) courseInput.placeholder = 'e.g. SPM Science Stream / O-Levels';
        } else if (val === 'general') {
            if (programmeLabel) programmeLabel.textContent = 'LEARNING TRACK / CERTIFICATION';
            if (courseInput) courseInput.placeholder = 'e.g. AWS Cloud Architect / Self-Taught Developer';
        } else {
            if (programmeLabel) programmeLabel.textContent = 'DEGREE / PROGRAMME';
            if (courseInput) courseInput.placeholder = 'e.g. Bachelor of Computer Science';
        }
    }

    document.querySelectorAll('input[name="education_level"]').forEach(radio => {
        radio.addEventListener('change', updateTierLabels);
    });

    typeSelect.addEventListener('change', function() {
        if (this.value === 'IT') {
            courseInput.placeholder = "Enter your IT Major (e.g. Cyber Security)";
        } else {
            updateTierLabels();
        }
    });

    toggleEducationLevelVisibility();
</script>
{% if google_client_id %}
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    window.addEventListener('load', function() {
        if (window.google) {
            google.accounts.id.initialize({
                client_id: "{{ google_client_id }}",
                callback: handleGoogleCredentialResponse,
                auto_select: false,
                cancel_on_tap_outside: true
            });
            google.accounts.id.prompt();
        }
    });

    function handleGoogleCredentialResponse(response) {
        if (!response || !response.credential) return;
        const btnText = document.getElementById('google-btn-text');
        if (btnText) btnText.textContent = 'Authenticating with Google...';
        
        fetch('/api/auth/google-verify-token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: response.credential })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                window.location.href = data.redirect_url || '/student/dashboard';
            } else {
                alert('Google Sign-In failed: ' + (data.message || 'Unknown error'));
                if (btnText) btnText.textContent = 'Sign up with Google';
            }
        })
        .catch(err => {
            console.error('Error verifying Google token:', err);
            if (btnText) btnText.textContent = 'Sign up with Google';
        });
    }
</script>
{% endif %}
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are Offline | Smart Study Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .offline-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            padding: 40px 30px;
            max-width: 440px;
            text-align: center;
        }
        .offline-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #fff3cd;
            color: #ffc107;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="offline-card mx-auto">
                    <div class="offline-icon">
                        <i class="bi bi-wifi-off"></i>
                    </div>
                    <h4 class="fw-bold text-dark mb-2">No Internet Connection</h4>
                    <p class="text-muted small mb-4">
                        You are currently offline. Check your network connection to sync your latest study schedules, assignments, and AI tutor chats.
                    </p>
                    <button class="btn btn-primary px-4 py-2 fw-semibold rounded-3 w-100 mb-2" onclick="window.location.reload()">
                        <i class="bi bi-arrow-clockwise me-1"></i> Retry Connection
                    </button>
                    <a href="/dashboard" class="btn btn-light border text-muted px-4 py-2 small rounded-3 w-100">
                        Go to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

    <circle cx="384" cy="292" r="10" />
    <path d="M 378 300 L 390 300 L 394 335 L 374 335 Z" opacity="0.9" />
    <!-- Sparkle Stars -->
    <path d="M 130 145 Q 130 165 140 165 Q 130 165 130 185 Q 130 165 120 165 Q 130 165 130 145 Z" fill="#ffd166" />
    <path d="M 375 140 Q 375 155 383 155 Q 375 155 375 170 Q 375 155 367 155 Q 375 155 375 140 Z" fill="#ffd166" />

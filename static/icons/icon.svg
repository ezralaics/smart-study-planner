<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="100%" stop-color="#0a4da2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#primaryGrad)" filter="url(#shadow)" />
  <!-- Inner Subtle Accent Ring -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />
